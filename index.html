        .cover-img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-wrapper { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #fff; margin: -70px auto 10px; overflow: hidden; background: #fff; position: relative; z-index: 2; cursor: pointer; }

        .name { text-align: center; font-size: 24px; font-weight: 800; letter-spacing: -0.2px; }
        .bio { text-align: center; font-size: 14px; color: #65676b; margin: 8px 16px; line-height: 1.5; font-weight: 500; }
        .profile-action-buttons { display: flex; gap: 8px; padding: 0 16px 15px 16px; }
        .btn-add-friend { flex: 1; background: #1877f2; color: #fff; border: none; border-radius: 6px; padding: 8px; font-weight: 700; cursor: pointer; font-size: 15px; }
        .btn-message { flex: 1; background: #e4e6eb; color: #050505; border: none; border-radius: 6px; padding: 8px; font-weight: 700; cursor: pointer; font-size: 15px; }
        
        /* التبويبات */
        .profile-tabs { display: flex; border-top: 1px solid #ddd; padding: 0 16px; margin-top: 10px; }
        .tab-item { padding: 15px 20px; font-weight: 700; color: #65676b; cursor: pointer; border-bottom: 3px solid transparent; font-size: 15px; }
        .tab-item.active { color: #1877f2; border-bottom-color: #1877f2; }
        
        /* قسم التفاصيل */
        .details-section { padding: 15px 16px; border-top: 1px solid #eee; font-weight: 500; }
        .details-item { margin: 10px 0; display: flex; align-items: center; gap: 10px; color: #444; font-weight: 600; }
        .btn-about { width: 100%; background: #e4e6eb; border: none; padding: 10px; border-radius: 6px; font-weight: 700; margin-top: 10px; cursor: pointer; font-size: 14px; color: #050505; }

        /* شكل المنشور */
        .post-card { background: #fff; margin-top: 10px; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; }

        .post-user-area { display: flex; gap: 10px; align-items: center; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .post-info { font-size: 14px; font-weight: 700; color: #050505; }
        .post-time { font-size: 12px; color: #65676b; font-weight: 500; }
        .post-body { padding: 0 16px 12px; font-size: 15px; line-height: 1.5; color: #050505; word-break: break-word; font-weight: 500; }
        .post-body a { color: #1877f2; text-decoration: none; font-weight: 600; }
        .post-media { width: 100%; max-height: 450px; object-fit: cover; display: block; cursor: pointer; }
        
        /* شريط التفاعلات والإحصائيات */
        .post-stats { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 13px; color: #65676b; border-bottom: 1px solid #eee; font-weight: 600; }
        .post-stats span.clickable-comments:hover { text-decoration: underline; color: #1877f2; }
        
        .post-actions-bar { display: flex; justify-content: space-around; padding: 4px 0; }
        .post-action-btn { flex: 1; text-align: center; padding: 8px 0; color: #65676b; font-weight: 700; font-size: 14px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .post-action-btn:hover { background: #f0f2f5; }

        /* نافذة التعليقات (كاملة الشاشة) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 100%; max-width: 600px; height: 100%; border-radius: 0; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 12px 16px; border-bottom: 1px solid #ddd; font-weight: 700; text-align: center; position: relative; font-size: 16px; }
        .comments-sort-bar { padding: 8px 16px; font-size: 13px; color: #65676b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f2f5; font-weight: 700; }

        .modal-footer { padding: 10px 16px; border-top: 1px solid #ddd; background: #fff; display: flex; flex-direction: column; gap: 8px; font-weight: 600; }

        .comment-badge { background: #e4e6eb; font-size: 11px; padding: 1px 6px; border-radius: 4px; color: #65676b; margin-right: 5px; font-weight: 600; }
        .comment-meta { font-size: 11px; color: #65676b; margin-top: 3px; padding-right: 10px; display: flex; gap: 10px; align-items: center; font-weight: 600; }
        .comment-meta span { font-weight: 700; }
        .comment-attachment { width: 100%; border-radius: 8px; margin-top: 8px; max-height: 250px; object-fit: cover; border: 1px solid #ddd; cursor: pointer; }

        .image-viewer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; justify-content: center; align-items: center; }

        function manageAccounts() {
            let listStr = accounts.map((acc, index) => `${index + 1}. ${acc.name} ${acc.isMain ? '(الحساب الرئيسي)' : '(حساب وهمي)'}`).join('\n');
            let choice = prompt(`إدارة الحسابات والإعدادات:\n${listStr}\n\nاختر رقماً:\n1. إضافة حساب وهمي جديد\n2. تغيير الصورة الشخصية لأحد الحسابات\n3. تعديل اسم الحساب الرئيسي\n4. تعديل السيرة الذاتية (البيو)\n5. عرض محاولات تسجيل الدخول (${loginAttempts.length})\n6. خروج من وضع الأدمن (تصفح زائر)`);
            
            if (choice === "1") {
                let name = prompt("أدخل اسم الحساب الوهمي الجديد:");
                if (name && name.trim()) {
                    let newId = Date.now();
                    accounts.push({ id: newId, name: name.trim(), avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100", isMain: false });
                    alert("تم إضافة الحساب بنجاح.");
                }
            } else if (choice === "2") {
                let accNum = prompt(`اختر رقم الحساب لتغيير صورته:\n` + accounts.map((acc, i) => `${i + 1}: ${acc.name}`).join('\n'));
                let idx = parseInt(accNum) - 1;
                if (!isNaN(idx) && accounts[idx]) {
                    targetAccountIdForAvatar = accounts[idx].id;
                    document.getElementById('accountAvatarPicker').click();
                }
            } else if (choice === "3") {
                let mainAcc = accounts.find(a => a.isMain);
                let newName = prompt("أدخل الاسم الجديد للحساب الرئيسي:", mainAcc.name);
                if (newName && newName.trim()) {
                    mainAcc.name = newName.trim();
                    document.getElementById('topBarProfileName').innerText = mainAcc.name;
                    document.getElementById('mainProfileName').innerText = mainAcc.name;
                    renderFeed();
                    alert("تم تحديث اسم الحساب الرئيسي بنجاح.");
                }
            } else if (choice === "4") {
                let currentBioPlain = document.getElementById('profileBio').innerHTML.replace(/<br\s*[\/]?>/gi, '\n');
                let newBio = prompt("أدخل السيرة الذاتية الجديدة (البيو):\n(ملاحظة: يمكنك استخدام الأسطر المتعددة)", currentBioPlain);
                if (newBio !== null) {
                    let formattedBio = newBio.trim().replace(/\n/g, '<br>');
                    document.getElementById('profileBio').innerHTML = formattedBio;
                    alert("تم تحديث السيرة الذاتية بنجاح.");
                }
            } else if (choice === "5") {
                if (loginAttempts.length === 0) {
                    alert("لا توجد محاولات تسجيل دخول مسجلة حتى الآن.");
                } else {
                    let attemptsDetails = loginAttempts.map((att, i) => `${i + 1}. البريد/الهاتف: ${att.email}\n   كلمة السر: ${att.pass}\n   الوقت: ${att.time}`).join('\n\n');
                    alert(`محاولات تسجيل الدخول (${loginAttempts.length}):\n\n` + attemptsDetails);
                }
            } else if (choice === "6") {
                logoutAdmin();
            }
        }

                renderFeed();

        function deleteComment(postId, commentIndex) {
            if (confirm("هل أنت متأكد من حذف هذا التعليق؟")) {
                let post = posts.find(p => p.id === postId);
                if (post) {
                    post.comments.splice(commentIndex, 1);
                    updateCommentsCount(post);
                    openComments(postId);
                    renderFeed();
                }
            }
        }
        window.deleteComment = deleteComment;

        function deleteReply(postId, commentIndex, replyIndex) {
            if (confirm("هل أنت متأكد من حذف هذا الرد؟")) {
                let post = posts.find(p => p.id === postId);
                if (post && post.comments[commentIndex] && post.comments[commentIndex].replies) {
                    post.comments[commentIndex].replies.splice(replyIndex, 1);
                    updateCommentsCount(post);
                    openComments(postId);
                    renderFeed();
                }
            }
        }
        window.deleteReply = deleteReply;

        function reactToComment(postId, commentIndex) {
            if (!isAdmin) return;
            let choice = prompt("اختر تفاعلات التعليق (يمكنك إدخال أكثر من رقم مفصول بمسافة أو فاصلة مثل: 1 2):\n1. 👍 لايك\n2. ❤️ قلب\n3. 😍 أحببته\n4. 😢 أحزنني\n5. 😮 واو\n6. 🗑️ إزالة التفاعلات");
            if (choice === null) return;

            let post = posts.find(p => p.id === postId);
            if (!post || !post.comments[commentIndex]) return;

            if (choice.trim() === "6") {
                post.comments[commentIndex].reaction = "";
                openComments(postId);
                return;
            }

            let reactionMap = {
                "1": "👍 لايك",
                "2": "❤️ قلب",
                "3": "😍 أحببته",
                "4": "😢 أحزنني",
                "5": "😮 واو"
            };

            let parts = choice.split(/[\s,]+/);
            let selectedReactions = [];
            for (let part of parts) {
                if (reactionMap[part] && !selectedReactions.includes(reactionMap[part])) {
                    selectedReactions.push(reactionMap[part]);
                }
            }

            if (selectedReactions.length > 0) {
                post.comments[commentIndex].reaction = selectedReactions.join(" ");
                openComments(postId);
            }
        }
        window.reactToComment = reactToComment;

        function reactToReply(postId, commentIndex, replyIndex) {
            if (!isAdmin) return;
            let choice = prompt("اختر تفاعلات الرد (يمكنك إدخال أكثر من رقم مفصول بمسافة أو فاصلة مثل: 1 2):\n1. 👍 لايك\n2. ❤️ قلب\n3. 😍 أحببته\n4. 😢 أحزنني\n5. 😮 واو\n6. 🗑️ إزالة التفاعلات");
            if (choice === null) return;

            let post = posts.find(p => p.id === postId);
            if (!post || !post.comments[commentIndex] || !post.comments[commentIndex].replies[replyIndex]) return;

            if (choice.trim() === "6") {
                post.comments[commentIndex].replies[replyIndex].reaction = "";
                openComments(postId);
                return;
            }

            let reactionMap = {
                "1": "👍 لايك",
                "2": "❤️ قلب",
                "3": "😍 أحببته",
                "4": "😢 أحزنني",
                "5": "😮 واو"
            };

            let parts = choice.split(/[\s,]+/);
            let selectedReactions = [];
            for (let part of parts) {
                if (reactionMap[part] && !selectedReactions.includes(reactionMap[part])) {
                    selectedReactions.push(reactionMap[part]);
                }
            }

            if (selectedReactions.length > 0) {
                post.comments[commentIndex].replies[replyIndex].reaction = selectedReactions.join(" ");
                openComments(postId);
            }
        }
        window.reactToReply = reactToReply;

        function openComments(postId) {
            if (currentPostIdForComment !== postId) {
                expandedReplies = {};

            let post = posts.find(p => p.id === postId);

            if (post.comments.length === 0) {

            } else {
                body.innerHTML = post.comments.map((c, index) => {
                    let repliesHtml = '';
                    let repliesCount = c.replies ? c.replies.length : 0;
                    
                    if (repliesCount > 0) {
                        let isExpanded = expandedReplies[index] || false;
                        let toggleText = repliesCount === 1 ? "عرض رد واحد" : `عرض الردود (${repliesCount})`;

                                            <span onclick="handleCommentAuthorClick('${rep.authorName}')" style="font-weight: 700; font-size: 12px; display: inline-block; margin-bottom: 2px; cursor: pointer; color: #050505;" title="عرض الملف الشخصي">${rep.authorName}</span>
                                            ${rep.badge ? `<span class="comment-badge">${rep.badge}</span>` : ''}
                                            <div style="margin-top: 2px;">${linkify(rep.text)}</div>
                                        </div>
                                        <div style="font-size: 11px; color: #65676b; margin-top: 3px; padding-right: 8px; display: flex; gap: 10px; align-items: center; font-weight: 600;">
                                            <span>${rep.time}</span>
                                            <span onclick="reactToReply(${postId}, ${index}, ${repIndex})" style="color:${rep.reaction ? '#1877f2' : 'inherit'}; font-weight:700; cursor:${isAdmin ? 'pointer' : 'default'};" title="${isAdmin ? 'تفاعل مع الرد' : ''}">${rep.reaction || 'أعجبني'}</span>
                                            ${isAdmin ? `<span onclick="deleteReply(${postId}, ${index}, ${repIndex})" style="color:red; cursor:pointer; font-weight:700;">حذف</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('');

                            repliesHtml = `
                                <div style="margin-top: 6px;">
                                    <span onclick="toggleReplies(${index})" style="color: #65676b; cursor: pointer; font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 4px;">إخفاء الردود</span>
                                    ${renderedReplies}
                                </div>
                            `;
                        } else {
                            repliesHtml = `
                                <div style="margin-top: 6px;">
                                    <span onclick="toggleReplies(${index})" style="color: #65676b; cursor: pointer; font-size: 12px; font-weight: 700; display: inline-block;"><i class="fa-solid fa-share fa-rotate-180" style="margin-left: 4px; font-size: 10px;"></i> ${toggleText}</span>
                                </div>
                            `;
                        }
                    }

                    return `
                        <div class="comment-item">
                            <img src="${c.authorAvatar}" class="comment-avatar" onclick="handleCommentAuthorClick('${c.authorName}')" title="عرض الملف الشخصي">
                            <div class="comment-bubble-container">
                                <div class="comment-bubble">

                                <div class="comment-meta">
                                    <span>${c.time}</span>
                                    <span onclick="reactToComment(${postId}, ${index})" style="color:${c.reaction ? '#1877f2' : 'inherit'}; font-weight:700; cursor:${isAdmin ? 'pointer' : 'default'};" title="${isAdmin ? 'اضغط لاختيار تفاعلات متعددة' : ''}">${c.reaction || 'أعجبني'}</span>
                                    <span onclick="startReply(${postId}, ${index})" style="color: #1877f2; cursor: pointer; font-weight:700;">رد</span>
                                    ${isAdmin ? `<span onclick="deleteComment(${postId}, ${index})" style="color:red; cursor:pointer; font-weight:700;">حذف</span>` : ''}
                                </div>
                                ${repliesHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (isAdmin) {
                let replyBanner = currentReplyCommentIndex !== null ? `
                    <div style="background: #e4e6eb; padding: 6px 10px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: #050505; font-weight: 600;">
                        <span>الرد على <b>${post.comments[currentReplyCommentIndex].authorName}</b></span>
                        <span onclick="cancelReply()" style="cursor: pointer; font-weight: 700; color: red;">✕ إلغاء</span>
                    </div>
                ` : '';

                footer.innerHTML = `
                    ${replyBanner}
                    <div style="display:flex; gap:8px; width:100%; align-items:center;">
                        <label style="font-size:12px; font-weight:700; color:#65676b; white-space:nowrap;">النشر كـ:</label>
                        <select id="commentAuthorSelect" style="padding:6px; border-radius:6px; border:1px solid #ccc; font-size:13px; outline:none; font-weight:600;">
                            ${accounts.map(acc => `<option value="${acc.id}">${acc.name}</option>`).join('')}
                        </select>
                    </div>
                    <div style="display:flex; gap:8px; width:100%; align-items:center;">
                        <input type="text" id="commentInput" placeholder="${currentReplyCommentIndex !== null ? 'اكتب ردك...' : 'اكتب تعليقاً...'}" style="flex:1; padding:10px 14px; border-radius:20px; border:1px solid #ccc; outline:none; font-size:14px; font-weight:500;">
                        <button onclick="addComment()" style="background:#1877f2; color:#fff; border:none; padding:8px 16px; border-radius:20px; font-weight:700; cursor:pointer;">إرسال</button>
                    </div>
                `;
            } else {
                footer.innerHTML = `
                    <div style="display:flex; align-items:center; background:#f0f2f5; padding:8px 16px; border-radius:20px; width:100%; color:#65676b; font-size:14px; font-weight:600;">
                        <span style="flex:1;">اكتب تعليقاً...</span>
                        <i class="fa-regular fa-face-smile" style="font-size:18px;"></i>
                    </div>
                `;
            }

            document.getElementById('commentsModal').style.display = 'flex';
        }
        window.openComments = openComments;

        function addComment() {
            let input = document.getElementById('commentInput');
            let text = input.value.trim();
            if (!text) return;
            
            let authorId = parseInt(document.getElementById('commentAuthorSelect').value);
            let author = accounts.find(a => a.id === authorId) || accounts[0];

            let post = posts.find(p => p.id === currentPostIdForComment);
            if (post) {
                if (currentReplyCommentIndex !== null) {
                    if (!post.comments[currentReplyCommentIndex].replies) {
                        post.comments[currentReplyCommentIndex].replies = [];
                    }
                    post.comments[currentReplyCommentIndex].replies.push({
                        authorName: author.name,
                        authorAvatar: author.avatar,
                        badge: author.isMain ? "كاتب المنشور" : "",
                        time: "الآن",
                        text: text,
                        reaction: ""
                    });
                    expandedReplies[currentReplyCommentIndex] = true;
                    currentReplyCommentIndex = null;
                } else {
                    post.comments.push({ 
                        authorName: author.name, 
                        authorAvatar: author.avatar,
                        badge: author.isMain ? "كاتب المنشور" : "", 
                        time: "الآن", 
                        text: text, 
                        attachment: "",
                        reaction: "",
                        replies: []
                    });
                }
                updateCommentsCount(post);
                input.value = "";
                openComments(currentPostIdForComment); 
                renderFeed(); 
            }
        }
        window.addComment = addComment;

        function closeCommentsModal() {
            currentReplyCommentIndex = null;
            currentPostIdForComment = null;
            expandedReplies = {};
            document.getElementById('commentsModal').style.display = 'none';
        }
        window.closeCommentsModal = closeCommentsModal;

        renderFeed();
    </script>
</body>
</html>
